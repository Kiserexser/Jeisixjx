name: Build Fabric Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Build Mod
        run: |
          chmod +x gradlew
          ./gradlew build
      
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SwillMod
          path: build/libs/*.jar
      
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: SwillMod
          files: build/libs/*.jar
